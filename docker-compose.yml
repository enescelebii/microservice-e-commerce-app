version: "3.9"

services:

  # =========================
  # DATABASES
  # =========================
  postgres:
    container_name: ms_pg_sql
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - microservices_net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pg_admin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - microservices_net
    restart: unless-stopped

  mongodb:
    container_name: ms_mongo_db
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: vena
      MONGO_INITDB_ROOT_PASSWORD: vena
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
    networks:
      - microservices_net
    restart: unless-stopped

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express:1.0.2
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: vena
      ME_CONFIG_MONGODB_ADMINPASSWORD: vena
      ME_CONFIG_MONGODB_SERVER: mongodb
    ports:
      - "8081:8081"
    networks:
      - microservices_net
    restart: unless-stopped

  # =========================
  # KAFKA
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - microservices_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices_net

  # =========================
  # OBSERVABILITY & INFRA
  # =========================
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - microservices_net

  mail-dev:
    image: maildev/maildev
    container_name: mail-dev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - microservices_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    ports:
      - "9099:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      #KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: >
      start-dev
      --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realms/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
    networks:
      - microservices_net

  # =========================
  # CORE SPRING SERVICES
  # =========================
  config-server:
    build: ./services/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
    networks:
      - microservices_net
    restart: unless-stopped

  discovery-service:
    build: ./services/discovery
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    depends_on:
      - config-server
    networks:
      - microservices_net

  gateway-service:
    build: ./services/gateway
    container_name: gateway-service
    ports:
      - "8222:8222"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
    networks:
      - microservices_net

  customer-service:
    build: ./services/customer
    container_name: customer-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
    networks:
      - microservices_net

  order-service:
    build: ./services/order
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
    networks:
      - microservices_net

  product-service:
    build: ./services/product
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
    networks:
      - microservices_net

  payment-service:
    build: ./services/payment
    container_name: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
    networks:
      - microservices_net

  notification-service:
    build: ./services/notification
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - config-server
      - discovery-service
      - kafka
      - mongodb
    networks:
      - microservices_net

networks:
  microservices_net:
    driver: bridge

volumes:
  keycloak_data:
  postgres:
  pgadmin:
  mongo:
